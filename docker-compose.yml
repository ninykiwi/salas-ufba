services:
  postgres:
    image: postgres:16-alpine
    container_name: salas-ufba-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - salas_network

  auth-service:
    build: ./services/auth-service
    container_name: salas-ufba-auth-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ROOMS_SERVICE_URL: ${ROOMS_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - salas_network

  api-gateway:
    build: ./services/api-gateway
    container_name: salas-ufba-api-gateway
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    depends_on:
      - auth-service
    networks:
      - salas_network

  mongo:
    image: mongo:7
    container_name: salas-ufba-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - salas_network

  rooms-service:
    build: ./services/rooms-service
    container_name: salas-ufba-rooms-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/db_rooms
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - salas_network

  bff:
    build: ./services/bff
    container_name: salas-ufba-bff
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ROOMS_SERVICE_URL: ${ROOMS_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - rooms-service
    networks:
      - salas_network

  web:
    build: ./web
    container_name: salas-ufba-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL}
      BFF_INTERNAL_URL: http://bff:8000
    depends_on:
      - bff
    networks:
      - salas_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: salas-ufba-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - salas_network

networks:
  salas_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
